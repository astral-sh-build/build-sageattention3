[project]
name = "build-sageattention3-gpu-tests"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=1.24,<3",
    "pytest>=8,<10",
    "sageattn3==2.2.0+cu.12.8.torch.2.10",
    "torch==2.10.0+cu128",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
sageattn3 = { index = "astral-cu128" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
